name: LLM Soak (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pick | authored | both"
        required: false
        default: "both"
      seeds:
        description: "Comma-separated seeds"
        required: false
        default: "101,102,103"
      min_pass_rate:
        description: "Gate minimum pass rate (0-1)"
        required: false
        default: "0.9"

jobs:
  llm-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull model
        run: ollama pull llama3.2

      - name: Run gated LLM soak
        run: |
          python -m app.llm_soak \
            --mode "${{ inputs.mode }}" \
            --seeds "${{ inputs.seeds }}" \
            --ollama-model llama3.2 \
            --gate \
            --min-pass-rate "${{ inputs.min_pass_rate }}" \
            --max-mean-duration-sec 120 \
            --max-duration-sec 180 \
            --out runs/llm-soak-ci

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-soak-${{ github.run_id }}
          path: runs/llm-soak-ci
